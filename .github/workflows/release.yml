name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./packages/core/package.json').version")
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match packages/core version ${PKG_VERSION}" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @tasuketejs/core test
      - run: pnpm --filter @tasuketejs/core build

      - name: Pack and checksum
        run: |
          pnpm --filter @tasuketejs/core pack --pack-destination release
          cd release
          sha256sum *.tgz > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            release/tasuketejs-core-*.tgz \
            release/checksums.txt
